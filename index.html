    <style>
      /* Realistic Thermal Paper Effect */
      .receipt-paper {
        background-color: #ffffff;
        position: relative;
        background-image: radial-gradient(#00000005 0.5px, transparent 0.5px);
        background-size: 10px 10px;
      }

      /* Jagged Edge Generator (Top and Bottom) */
      .jagged-edge-top {
        background: linear-gradient(135deg, transparent 10px, #ffffff 10px),
                    linear-gradient(225deg, transparent 10px, #ffffff 10px);
        background-position: top left;
        background-size: 20px 20px;
        background-repeat: repeat-x;
        height: 20px;
        width: 100%;
        position: absolute;
        top: -10px;
        left: 0;
        z-index: 10;
      }

      .jagged-edge-bottom {
        background: linear-gradient(-45deg, transparent 10px, #ffffff 10px),
                    linear-gradient(45deg, transparent 10px, #ffffff 10px);
        background-position: bottom left;
        background-size: 20px 20px;
        background-repeat: repeat-x;
        height: 20px;
        width: 100%;
        position: absolute;
        bottom: -10px;
        left: 0;
        z-index: 10;
        filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.05));
      }

      /* Ink Simulation */
      .thermal-text {
        color: #000000;
        -webkit-font-smoothing: none; 
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* --- CUSTOM SCROLLBAR DESIGN --- */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }

      ::-webkit-scrollbar-track {
        background: transparent; 
      }

      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 9999px;
        border: 3px solid transparent;
        background-clip: content-box;
        transition: background-color 0.3s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8;
      }

      html.dark ::-webkit-scrollbar-thumb {
        background-color: #334155;
      }
      
      html.dark ::-webkit-scrollbar-thumb:hover {
        background-color: #475569;
      }
    </style>
